spring.application.name=central-incidentes
spring.datasource.url=${CENTRAL_DB_URL:jdbc:mysql://localhost:3306/central_incidentes?serverTimezone=America/Sao_Paulo}
spring.datasource.username=${CENTRAL_DB_USER:central_app}
spring.datasource.password=${CENTRAL_DB_PASSWORD}
server.error.include-message=never
server.error.include-stacktrace=never

# As páginas Thymeleaf serão adicionadas no Bloco 4.
spring.thymeleaf.check-template-location=false
