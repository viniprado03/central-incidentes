<!doctype html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><body>
<header class="topbar" th:fragment="header">
  <div class="topbar-inner">
    <a class="brand" th:href="@{/}" aria-label="Central de Incidentes, página inicial"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M12 2.5 20 6v5.5c0 4.9-3.3 8.1-8 10-4.7-1.9-8-5.1-8-10V6l8-3.5Z" stroke="currentColor" stroke-width="1.6"/><path d="m8.5 12 2.3 2.3 4.8-5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="brand-text">Central<span>Incidentes</span></span></a>
    <nav aria-label="Navegação principal"><a th:classappend="${aba != 'informacoes' and aba != 'permissoes'} ? 'nav-active'" th:href="@{/}"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 5h16v14H4zM4 9h16M8 13h3m-3 3h6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>Incidentes</a><a th:classappend="${aba == 'informacoes'} ? 'nav-active'" th:href="@{/informacoes}"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 19h16M6 16v-5m5 5V5m5 11v-8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>Informações</a><a th:if="${#authorization.expression('hasRole(''ADMINISTRADOR'')')}" th:classappend="${aba == 'permissoes'} ? 'nav-active'" th:href="@{/permissoes}"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 2.5 20 6v5.5c0 4.9-3.3 8.1-8 10-4.7-1.9-8-5.1-8-10V6l8-3.5ZM9 12l2 2 4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>Permissões</a></nav>
    <div class="account"><div class="account-avatar" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3" stroke="currentColor" stroke-width="1.6"/><path d="M5.5 20c.4-3.7 2.6-5.5 6.5-5.5s6.1 1.8 6.5 5.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></div><div class="account-info"><span class="account-caption">Conectado como</span><span class="account-name" th:text="${#authentication.name}">Conta</span></div><details class="demo-switch" th:if="${demonstracao}"><summary>Trocar perfil</summary><div class="demo-switch-menu"><span>Entrar como</span><form th:action="@{/demonstracao/entrar}" method="post"><input type="hidden" name="perfil" value="administrador"><button type="submit">Administrador</button></form><form th:action="@{/demonstracao/entrar}" method="post"><input type="hidden" name="perfil" value="analista"><button type="submit">Analista</button></form><form th:action="@{/demonstracao/entrar}" method="post"><input type="hidden" name="perfil" value="visualizador"><button type="submit">Visualizador</button></form></div></details><form th:action="@{/logout}" method="post"><button class="logout" type="submit">Sair</button></form></div>
  </div>
</header>
</body></html>
