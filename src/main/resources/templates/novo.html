<!doctype html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Novo incidente | Central</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div th:replace="~{fragments :: header}"></div><main class="container narrow"><a class="back" th:href="@{/}">← Voltar para incidentes</a><div class="page-heading"><div><p class="section-label">Registro</p><h1>Novo incidente</h1><p class="muted">Descreva a ocorrência para iniciar o acompanhamento.</p></div></div><div class="notice error" th:if="${erro}" th:text="${erro}"></div><section class="panel form-panel"><h2>Informações do incidente</h2><p class="muted">Todos os campos são obrigatórios.</p><form th:action="@{/incidentes}" method="post"><label for="titulo">Título</label><input id="titulo" name="titulo" maxlength="150" required placeholder="Ex.: E-mail suspeito recebido"><label for="descricao">Descrição</label><textarea id="descricao" name="descricao" rows="6" required placeholder="Conte o que aconteceu e inclua os detalhes conhecidos."></textarea><div class="form-grid"><div><label for="tipo">Tipo de incidente</label><select id="tipo" name="tipo" required><option value="">Selecione</option><option th:each="tipo : ${tipos}" th:value="${tipo.id_tipo}" th:text="${tipo.nome}"></option></select></div><div><label for="severidade">Severidade</label><select id="severidade" name="severidade" required><option value="">Selecione</option><option th:each="s : ${severidades}" th:value="${s.id_severidade}" th:text="${s.nome}"></option></select></div></div><div class="form-actions"><a class="button secondary" th:href="@{/}">Cancelar</a><button class="button primary" type="submit">Registrar incidente</button></div></form></section></main></body></html>
